; Overrides for Debian's default [www] pool
[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
; conf/options.php reads its configuration from the container environment
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Worker limits. Debian's default of 5 workers is too few: a single HotCRP
; page issues several parallel requests, so a handful of users can exhaust
; the pool, after which requests queue and the site appears to hang.
; PHP_FPM_MAX_CHILDREN is exported by the entrypoint (default 32).
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
; Kill requests that are stuck (e.g. on an unresponsive mail relay) so they
; cannot hold workers forever. Matches fastcgi_read_timeout in nginx.conf.
request_terminate_timeout = 300s
