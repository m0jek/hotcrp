; HotCRP settings (see README.md, "Update PHP settings")
upload_max_filesize = 64M
post_max_size = 72M
max_input_vars = 4096
session.gc_maxlifetime = 86400
; Sessions live on the data volume so restarts do not sign everyone out.
; Debian normally cleans sessions from cron; there is no cron here.
session.save_path = /data/sessions
session.gc_probability = 1
session.gc_divisor = 1000
mysqli.default_socket = /run/mysqld/mysqld.sock
