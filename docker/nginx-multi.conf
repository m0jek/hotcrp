# Nginx site for multiconference mode (HOTCRP_MULTICONFERENCE=true): each
# conference is served under /CONFID/.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/hotcrp;
    # Relative redirects, so they work behind a proxy or on another port
    absolute_redirect off;

    # Keep in sync with post_max_size in php.ini
    client_max_body_size 72m;

    # Static assets, /CONFID/{images,scripts,stylesheets}/...
    location ~ "^/[a-z0-9][a-z0-9_-]*/((?:images|scripts|stylesheets)/.*)$" {
        alias /srv/hotcrp/$1;
    }

    # /CONFID -> /CONFID/. Other one-component paths (e.g. /signin, from
    # before multiconference mode) go to HotCRP, which can redirect them to
    # HOTCRP_DEFAULT_CONFERENCE.
    location ~ "^/([a-z0-9][a-z0-9_-]*)$" {
        if (-f /data/conferences/$1.php) {
            return 301 $uri/$is_args$args;
        }
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(/[^/]+)()$;
        include /etc/nginx/hotcrp/fastcgi.conf;
    }

    # Everything else is handled by HotCRP's index.php. SCRIPT_NAME is set to
    # /CONFID, which HotCRP uses to select the conference.
    location / {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_split_path_info ^(/[^/]+)(/[\s\S]*)$;
        include /etc/nginx/hotcrp/fastcgi.conf;
    }
}
